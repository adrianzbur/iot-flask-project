<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard</title>
    <style>
        /* Apple-like Typography and Base */
        :root {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #32D74B;
            --accent-glow: rgba(50, 215, 75, 0.2);
            --danger: #FF453A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 900px; margin: 0 auto; position: relative; }

        /* Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .nav-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .header { text-align: center; padding: 20px 0 40px; }
        .header h1 { font-size: 2.5em; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); font-size: 1.1em; }

        /* Glassmorphism Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 24px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card h2 { font-size: 1.4em; font-weight: 600; margin-bottom: 20px; letter-spacing: -0.01em; }

        /* Status Bar */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 16px 24px; margin-bottom: 24px;
        }

        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            display: inline-block; margin-right: 8px;
        }
        .status-dot.online { background: var(--accent); box-shadow: 0 0 12px var(--accent-glow); animation: pulse 2s infinite; }
        .status-dot.offline { background: var(--danger); }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Big Display */
        .big-display { text-align: center; padding: 20px 0; }
        .big-number { font-size: 5em; font-weight: 700; letter-spacing: -0.04em; color: var(--text-primary); }
        .big-detail { color: var(--text-secondary); font-size: 1.2em; margin-top: 5px; }
        .big-time { color: rgba(255,255,255,0.3); font-size: 0.85em; margin-top: 12px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 24px; text-align: center;
        }
        .stat-value { font-size: 2em; font-weight: 700; margin-bottom: 4px; }
        .stat-label { color: var(--text-secondary); font-size: 0.85em; font-weight: 500; }

        /* Live Feed */
        .live-feed { max-height: 350px; overflow-y: auto; }
        .feed-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95em;
        }
        .feed-item:last-child { border-bottom: none; }
        .feed-id { color: var(--text-secondary); width: 50px; }
        .feed-calc { flex-grow: 1; }
        .feed-result { font-weight: 600; text-align: right; width: 80px; }
        .feed-time { color: var(--text-secondary); font-size: 0.85em; width: 80px; text-align: right; }

        /* Inputs */
        .config-input { display: flex; gap: 12px; margin-top: 12px; }
        .config-input input {
            flex-grow: 1; padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: var(--text-primary); font-size: 1em;
        }
        .config-input input:focus { outline: none; border-color: var(--accent); }
        .config-input button {
            padding: 14px 24px; background: rgba(255,255,255,0.1); color: var(--text-primary);
            border: none; border-radius: 12px; cursor: pointer; font-weight: 600;
        }
        .config-input button:hover { background: rgba(255,255,255,0.15); }

    </style>
</head>
<body>
    <div class="container">
        
        <div class="top-nav">
            <a href="/" class="nav-btn">⬅ Administrácia</a>
        </div>

        <div class="header">
            <h1>Dashboard</h1>
            <p>Klientský pohľad v reálnom čase</p>
        </div>

        <div class="status-bar">
            <div>
                <span class="status-dot offline" id="statusDot"></span>
                <span id="statusText" style="font-weight:500;">Nepripojené</span>
            </div>
            <div style="color: var(--text-secondary); font-size: 0.9em;">
                Obnova: <span id="lastUpdate">—</span>
            </div>
        </div>

        <div class="card">
            <h2>Posledný záznam</h2>
            <div class="big-display" id="poslednyDisplay">
                <p style="color:var(--text-secondary)">Čakám na dáta...</p>
            </div>
        </div>

        <div class="card">
            <h2>Prehľad</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="statPocet">—</div>
                    <div class="stat-label">Operácií</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statPriemer">—</div>
                    <div class="stat-label">Priemer</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statPlus">—</div>
                    <div class="stat-label">Sčítania</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Live Feed</h2>
            <div class="live-feed" id="liveFeed">
                <p style="text-align:center; color:var(--text-secondary); margin-top:20px;">Čakám na dáta...</p>
            </div>
        </div>

        <div class="card" style="padding: 20px;">
            <p style="font-size:0.9em; color:var(--text-secondary); margin-bottom:8px;">Zdrojové API</p>
            <div class="config-input">
                <input type="text" id="backendUrl" value="">
                <button onclick="pripojNaBackend()">Pripojiť</button>
            </div>
        </div>

    </div>

    <script>
        let backendUrl = "";
        let refreshInterval = null;

        function pripojNaBackend() {
            let url = document.getElementById("backendUrl").value.trim();
            if (!url) url = window.location.origin;
            backendUrl = url.replace(/\/$/, "");

            if (refreshInterval) clearInterval(refreshInterval);
            nacitajVsetko();
            refreshInterval = setInterval(nacitajVsetko, 5000);
        }

        async function nacitajVsetko() {
            try {
                const [historiaRes, statsRes] = await Promise.all([
                    fetch(`${backendUrl}/api/historia`),
                    fetch(`${backendUrl}/api/statistiky`)
                ]);
                const historia = await historiaRes.json();
                const stats = await statsRes.json();

                aktualizujStatus(true);
                zobrazPosledny(historia);
                zobrazStatistiky(stats);
                zobrazLiveFeed(historia);
            } catch (error) {
                aktualizujStatus(false);
            }
        }

        function aktualizujStatus(jeOnline) {
            const dot = document.getElementById("statusDot");
            const text = document.getElementById("statusText");
            const update = document.getElementById("lastUpdate");

            if (jeOnline) {
                dot.className = "status-dot online";
                text.textContent = "Pripojené";
                update.textContent = new Date().toLocaleTimeString("sk-SK");
            } else {
                dot.className = "status-dot offline";
                text.textContent = "Odpojené";
            }
        }

        function zobrazPosledny(historia) {
            const display = document.getElementById("poslednyDisplay");
            if (!historia || historia.length === 0) return;
            const pos = historia[0];
            const sym = { plus: "+", minus: "−", krat: "×", deleno: "÷" }[pos.operacia] || "?";
            display.innerHTML = `
                <div class="big-number">${pos.vysledok}</div>
                <div class="big-detail">${pos.cislo1} ${sym} ${pos.cislo2}</div>
                <div class="big-time">ID #${pos.id} &nbsp;·&nbsp; ${pos.cas}</div>
            `;
        }

        function zobrazStatistiky(stats) {
            document.getElementById("statPocet").textContent = stats.celkovy_pocet || 0;
            document.getElementById("statPriemer").textContent = stats.priemerny_vysledok ? stats.priemerny_vysledok.toFixed(1) : "0";
            document.getElementById("statPlus").textContent = stats.podla_operacie?.plus || 0;
        }

        function zobrazLiveFeed(historia) {
            const feed = document.getElementById("liveFeed");
            if (!historia || historia.length === 0) return;
            let html = "";
            historia.forEach(item => {
                const sym = { plus: "+", minus: "−", krat: "×", deleno: "÷" }[item.operacia] || "?";
                html += `
                    <div class="feed-item">
                        <span class="feed-id">#${item.id}</span>
                        <span class="feed-calc">${item.cislo1} ${sym} ${item.cislo2}</span>
                        <span class="feed-result">${item.vysledok}</span>
                        <span class="feed-time">${item.cas.split(" ")[1]}</span>
                    </div>
                `;
            });
            feed.innerHTML = html;
        }

        document.getElementById("backendUrl").value = window.location.origin;
        pripojNaBackend();
    </script>
</body>
</html>
